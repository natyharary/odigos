apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: odigos-ai-agent
rules:
  - apiGroups: ["odigos.io"]
    resources:
      - sources
      - instrumentationconfigs
      - instrumentationinstances
      - destinations
      - collectorsgroups
      - processors
      - actions
    verbs: ["get", "list"]

  - apiGroups: ["odigos.io"]
    resources: ["sources"]
    verbs: ["create"]

  # Phase 7: instrumentationrules - read for diagnosis, create/update/patch
  # for the override_distro / enable_obi / disable_obi mutations (each still
  # gated by user approval). No `delete` - rollback is manual `kubectl delete`.
  # See ADR-017.
  - apiGroups: ["odigos.io"]
    resources: ["instrumentationrules"]
    verbs: ["get", "list", "create", "update", "patch"]

  - apiGroups: [""]
    resources:
      - pods
      - configmaps
      - namespaces
    verbs: ["get", "list"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs: ["get", "list"]

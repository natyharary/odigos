apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: odigos-ai-agent
rules:
  - apiGroups: ["odigos.io"]
    resources:
      - sources
      - instrumentationconfigs
      - instrumentationinstances
      - instrumentationrules
      - destinations
      - collectorsgroups
      - processors
      - actions
    verbs: ["get", "list", "watch"]

  - apiGroups: ["odigos.io"]
    resources: ["sources"]
    verbs: ["create"]

  - apiGroups: [""]
    resources:
      - pods
      - configmaps
      - services
      - namespaces
      - nodes
    verbs: ["get", "list"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs: ["get", "list"]

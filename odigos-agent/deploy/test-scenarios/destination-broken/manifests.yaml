# Scenario: instrumented workload + Destination pointing at a bogus host.
#
# odigos reconciles a Source CR -> InstrumentationConfig, the gateway
# renders an OTLP exporter for `bad-otlp`, and exports start failing
# because the endpoint host doesn't resolve. The destination subgraph
# should pick this up via `get_destination_config_in_gateway`,
# `get_gateway_export_errors`, and `probe_destination_endpoint`.
#
# The Destination type is `otlp` (built-in) so no custom destination
# image is needed.
---
apiVersion: v1
kind: Namespace
metadata:
  name: odigos-agent-test
  labels:
    odigos.io/agent-test: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: odigos-agent-test
  labels:
    app: demo
    odigos.io/agent-test: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
apiVersion: odigos.io/v1alpha1
kind: Source
metadata:
  name: demo
  namespace: odigos-agent-test
  labels:
    odigos.io/agent-test: "true"
spec:
  workload:
    name: demo
    namespace: odigos-agent-test
    kind: Deployment
  otelServiceName: demo
---
apiVersion: odigos.io/v1alpha1
kind: Destination
metadata:
  name: bad-otlp
  namespace: odigos-system
  labels:
    odigos.io/agent-test: "true"
spec:
  destinationName: bad-otlp
  type: otlp
  signals:
    - TRACES
    - METRICS
    - LOGS
  data:
    # Unresolvable host on a closed port - the exporter will fail every
    # send. No secret reference - the OTLP type doesn't require one.
    OTLP_GRPC_ENDPOINT: "this-host-does-not-exist.invalid:4317"

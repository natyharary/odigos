{{- if and (not .Values.anthropic.existingSecret) (not .Values.anthropic.apiKey) -}}
{{- fail "anthropic.apiKey or anthropic.existingSecret must be set" -}}
{{- end -}}
{{- if not .Values.anthropic.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odigos-ai-agent.anthropicSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "odigos-ai-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.anthropic.existingSecretKey }}: {{ .Values.anthropic.apiKey | quote }}
{{- end }}

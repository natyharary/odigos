apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "odigos-ai-agent.fullname" . }}
  labels:
    {{- include "odigos-ai-agent.labels" . | nindent 4 }}
rules:
  # Odigos CRDs - read-only for diagnosis. No `watch` because no MCP tool
  # builds informers; reads are one-shot Get/List per agent call.
  - apiGroups: ["odigos.io"]
    resources:
      - sources
      - instrumentationconfigs
      - instrumentationinstances
      - destinations
      - collectorsgroups
      - processors
      - actions
    verbs: ["get", "list"]

  # Odigos sources - the one v1 mutation, gated at runtime by user approval.
  # See odigos-agent/docs/PLAN.md (`apply_create_source`) and ADR-015.
  - apiGroups: ["odigos.io"]
    resources: ["sources"]
    verbs: ["create"]

  # Phase 7: instrumentationrules - read for diagnosis, create/update/patch
  # for the override_distro / enable_obi / disable_obi mutations (each still
  # gated by user approval). No `delete` - rollback is manual `kubectl delete`.
  # See ADR-017.
  - apiGroups: ["odigos.io"]
    resources: ["instrumentationrules"]
    verbs: ["get", "list", "create", "update", "patch"]

  # Core workload + pod state. Reads only. No `services` or `nodes` - the
  # destination probe (`probeTCPAndTLS`) dials the resolved endpoint
  # directly and no tool reads the Node API.
  - apiGroups: [""]
    resources:
      - pods
      - configmaps
      - namespaces
    verbs: ["get", "list"]

  # Pod logs - collector and odiglet log inspection.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Destination secrets - inspected for key names/lengths only; raw values
  # never leave the MCP. Read-only is sufficient.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

  # Workload controllers - the source-side diagnosis reads pod templates.
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs: ["get", "list"]

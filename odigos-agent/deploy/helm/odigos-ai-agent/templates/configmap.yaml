apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "odigos-ai-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "odigos-ai-agent.labels" . | nindent 4 }}
data:
  MCP_CLUSTER_URL: "http://127.0.0.1:9090/mcp"
  MCP_GRAPH_URL: "http://127.0.0.1:9091/mcp"
  ODIGOS_AGENT_MODEL: {{ .Values.model | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  APPROVAL_TIMEOUT_SECONDS: {{ .Values.approvalTimeoutSeconds | quote }}
  ODIGOS_PINNED_COMMIT: {{ .Values.codebaseGraph.pinnedCommit | quote }}

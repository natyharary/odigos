{{- if and (not .Values.agentToken.existingSecret) (not .Values.agentToken.value) -}}
{{- fail "agentToken.value or agentToken.existingSecret must be set - the frontend Go backend uses the same token to authenticate to /debug" -}}
{{- end -}}
{{- if not .Values.agentToken.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odigos-ai-agent.agentTokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "odigos-ai-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.agentToken.existingSecretKey }}: {{ .Values.agentToken.value | quote }}
{{- end }}
